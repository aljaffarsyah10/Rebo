name: REBO V2 Service Keep-Alive & Anti-Sleep

on:
  # Render Free Tier sleeps after 15 minutes of inactivity.
  # Running every 12 minutes keeps the WhatsApp Gateway alive 24/7.
  schedule:
    - cron: '*/12 * * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      target:
        description: 'Target service to ping'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - wa-gateway
          - supabase-direct
          - web-endpoint

jobs:
  keep-alive:
    name: Keep-Alive Ping (Render & Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report Trigger Time
        run: |
          echo "Keep-Alive execution started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Target mode: ${{ github.event.inputs.target || 'all (scheduled)' }}"

      # Step 1: Ping Render WhatsApp Gateway /health
      - name: Ping Render WhatsApp Gateway
        if: ${{ github.event.inputs.target == null || github.event.inputs.target == 'all' || github.event.inputs.target == 'wa-gateway' }}
        env:
          GATEWAY_URL: ${{ secrets.WHATSAPP_GATEWAY_URL }}
          GATEWAY_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          if [ -z "$GATEWAY_URL" ]; then
            echo "WHATSAPP_GATEWAY_URL secret is not configured in repository secrets."
            echo "WA_PING_STATUS=SKIPPED (Secret not set)" >> $GITHUB_ENV
            exit 0
          fi

          TARGET_URL="${GATEWAY_URL%/}/health"
          echo "Pinging WhatsApp Gateway: $TARGET_URL"

          AUTH_HEADER=""
          if [ -n "$GATEWAY_KEY" ]; then
            AUTH_HEADER="Authorization: Bearer $GATEWAY_KEY"
          fi

          START_TIME=$(date +%s%3N)
          HTTP_RESPONSE=$(curl -s -m 45 -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "$TARGET_URL" \
            ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
            -H "Accept: application/json")

          END_TIME=$(date +%s%3N)
          LATENCY=$((END_TIME - START_TIME))

          BODY=$(echo "$HTTP_RESPONSE" | sed -e 's/HTTP_STATUS:.*//g')
          STATUS_CODE=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Status Code: $STATUS_CODE"
          echo "Latency: ${LATENCY}ms"
          echo "Response Body: $BODY"

          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 300 ]; then
            echo "WhatsApp Gateway is awake and responsive!"
            echo "WA_PING_STATUS=SUCCESS (${STATUS_CODE}, ${LATENCY}ms)" >> $GITHUB_ENV
          else
            echo "::warning ::WhatsApp Gateway returned status $STATUS_CODE"
            echo "WA_PING_STATUS=WARNING (${STATUS_CODE}, ${LATENCY}ms)" >> $GITHUB_ENV
          fi

      # Step 2: Ping Supabase Database directly via REST API (PostgREST)
      - name: Ping Supabase REST API
        if: ${{ github.event.inputs.target == null || github.event.inputs.target == 'all' || github.event.inputs.target == 'supabase-direct' }}
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning ::NEXT_PUBLIC_SUPABASE_URL or NEXT_PUBLIC_SUPABASE_ANON_KEY are not set in GitHub Secrets."
            echo "SUPABASE_PING_STATUS=SKIPPED" >> $GITHUB_ENV
            exit 0
          fi

          echo "Pinging Supabase endpoint: $SUPABASE_URL/rest/v1/area?select=id_area&limit=1"
          START_TIME=$(date +%s%3N)
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "$SUPABASE_URL/rest/v1/area?select=id_area&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json")

          END_TIME=$(date +%s%3N)
          LATENCY=$((END_TIME - START_TIME))

          BODY=$(echo "$HTTP_RESPONSE" | sed -e 's/HTTP_STATUS:.*//g')
          STATUS_CODE=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Response Status Code: $STATUS_CODE"
          echo "Latency: ${LATENCY}ms"
          echo "Response Body: $BODY"

          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 300 ]; then
            echo "Direct Supabase ping succeeded!"
            echo "SUPABASE_PING_STATUS=SUCCESS (${STATUS_CODE}, ${LATENCY}ms)" >> $GITHUB_ENV
          else
            echo "::error ::Direct Supabase ping failed with status $STATUS_CODE"
            echo "SUPABASE_PING_STATUS=FAILED (${STATUS_CODE}, ${LATENCY}ms)" >> $GITHUB_ENV
            exit 1
          fi

      # Step 3: Ping Web Application Keep-Alive Endpoint (if APP_URL configured)
      - name: Ping Web Application Keep-Alive Endpoint
        if: ${{ github.event.inputs.target == null || github.event.inputs.target == 'all' || github.event.inputs.target == 'web-endpoint' }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret is not set. Skipping web app endpoint ping."
            echo "APP_PING_STATUS=SKIPPED" >> $GITHUB_ENV
            exit 0
          fi

          TARGET_URL="${APP_URL%/}/api/cron/keep-alive"
          echo "Pinging App URL: $TARGET_URL"

          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          fi

          START_TIME=$(date +%s%3N)
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "$TARGET_URL" \
            ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
            -H "Content-Type: application/json")

          END_TIME=$(date +%s%3N)
          LATENCY=$((END_TIME - START_TIME))

          BODY=$(echo "$HTTP_RESPONSE" | sed -e 's/HTTP_STATUS:.*//g')
          STATUS_CODE=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Response Status Code: $STATUS_CODE"
          echo "Latency: ${LATENCY}ms"
          echo "Response Body: $BODY"

          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 300 ]; then
            echo "Web app endpoint ping succeeded!"
            echo "APP_PING_STATUS=SUCCESS (${STATUS_CODE}, ${LATENCY}ms)" >> $GITHUB_ENV
          else
            echo "::warning ::Web app endpoint ping returned status $STATUS_CODE"
            echo "APP_PING_STATUS=WARNING (${STATUS_CODE}, ${LATENCY}ms)" >> $GITHUB_ENV
          fi

      - name: Keep-Alive Summary
        run: |
          echo "### REBO V2 Keep-Alive Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Render WhatsApp Gateway**: ${WA_PING_STATUS:-Skipped}" >> $GITHUB_STEP_SUMMARY
          echo "- **Supabase Database**: ${SUPABASE_PING_STATUS:-Skipped}" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Application Route**: ${APP_PING_STATUS:-Skipped}" >> $GITHUB_STEP_SUMMARY
          echo "- **Outcome**: Services refreshed. Render sleep timer and Supabase pause timer reset." >> $GITHUB_STEP_SUMMARY
